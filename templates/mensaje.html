<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Déjanos un mensaje — AWS Students Builder Group</title>
<style>
  :root {
    --aws-navy: #232f3e;
    --aws-orange: #ff9900;
    --miel: #ffc93c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px 18px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #91710b 0%, #136808 100%);
    color: #fff;
    text-align: center;
  }
  h1 { font-size: 26px; }
  h1 span { color: var(--aws-orange); }

  /* --------- animación del caballo (respirando → pastando) --------- */
  /* Los dos clips son verticales 9:16 y llevan canal alfa: el fondo de la
     página se ve a través, sin tarjeta ni recuadro. Los navegadores que no
     soportan alfa en VP9 muestran el color base incrustado (#243145), que es
     el mismo tono del degradado a esa altura. */
  .caballo {
    position: relative;
    height: min(50vh, 420px);
    aspect-ratio: 9 / 16;
    max-width: 100%;
  }
  .caballo video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;   /* nunca recorta al caballo */
    opacity: 0;
    transition: opacity .35s ease;
  }
  .caballo video.activo { opacity: 1; }

  /* --------- formulario --------- */
  form {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 18px;
    padding: 22px;
    backdrop-filter: blur(6px);
  }
  textarea {
    width: 100%;
    height: 96px;
    resize: none;
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 12px;
    font-size: 17px;
    font-family: inherit;
    outline: none;
    background: #fffbe9;
    color: var(--aws-navy);
  }
  textarea:focus { border-color: var(--aws-orange); }
  .contador { margin: 8px 0 14px; font-size: 14px; color: #9fb0c3; text-align: right; }
  .contador.limite { color: #ff7b72; font-weight: 700; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--aws-orange);
    color: var(--aws-navy);
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .55; cursor: not-allowed; }

  .aviso {
    max-width: 420px;
    width: 100%;
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 15.5px;
    font-weight: 600;
    display: none;
  }
  .aviso.ok    { display: block; background: #10432e; color: #7ee2b8; border: 1px solid #1d7a54; }
  .aviso.error { display: block; background: #4a1d1d; color: #ffb4ad; border: 1px solid #8a3232; }
  footer { font-size: 13px; color: #8296ac; }
</style>
</head>
<body>

  <h1>¡Hola! Somos <span>AWS Students Builder Group UAEMex</span></h1>

  <!-- Caballo: primero respirando, luego pastando (en bucle) -->
  <div class="caballo" id="caballo">
    <video id="video-respirando" class="activo"
           src="{{ url_for('static', filename='caballo-respirando.webm') }}"
           muted playsinline preload="auto" disablepictureinpicture
           aria-label="Caballo respirando"></video>
    <video id="video-pastando"
           src="{{ url_for('static', filename='caballo-pastando.webm') }}"
           muted playsinline preload="auto" disablepictureinpicture
           aria-label="Caballo pastando"></video>
  </div>

  <div id="aviso" class="aviso"></div>

  <form id="formulario">
    <textarea id="texto" maxlength="{{ max_caracteres }}"
              placeholder="Escribe tu mensaje aquí… aparecerá en la pantalla 🖥️"></textarea>
    <div class="contador"><span id="cuenta">0</span>/{{ max_caracteres }}</div>
    <button id="boton" type="submit">Enviar mensaje 🐝</button>
  </form>

  <footer>AWS Students Builder · CU · UAEMex · Tianguistenco</footer>

<script>
// --------- animación del caballo: respirando → pastando → repetir ---------
(() => {
  const clips = [
    document.getElementById("video-respirando"),
    document.getElementById("video-pastando"),
  ];
  if (clips.some(v => !v)) return;

  let actual = 0;

  function reproducir(indice) {
    actual = indice;
    clips.forEach((v, i) => {
      v.classList.toggle("activo", i === indice);
      if (i !== indice) v.pause();
    });
    const video = clips[indice];
    video.currentTime = 0;
    const promesa = video.play();
    if (promesa) promesa.catch(() => {});
  }

  clips.forEach((video, i) => {
    video.addEventListener("ended", () => reproducir((i + 1) % clips.length));
  });

  reproducir(0);

  // Si el navegador bloquea el autoplay, arrancamos con la primera interacción.
  document.addEventListener("pointerdown", () => {
    if (clips[actual].paused) reproducir(actual);
  }, { once: true });

  // Pausamos mientras la pestaña está oculta para no gastar batería.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) clips[actual].pause();
    else { const p = clips[actual].play(); if (p) p.catch(() => {}); }
  });
})();

() => {
  const MAX = {{ max_caracteres }};
  const form = document.getElementById("formulario");
  const texto = document.getElementById("texto");
  const cuenta = document.getElementById("cuenta");
  const boton = document.getElementById("boton");
  const aviso = document.getElementById("aviso");
  let temporizador = null;

  texto.addEventListener("input", () => {
    cuenta.textContent = texto.value.length;
    cuenta.parentElement.classList.toggle("limite", texto.value.length >= MAX);
  });

  function mostrarAviso(msj, tipo) {
    aviso.textContent = msj;
    aviso.className = "aviso " + tipo;
  }

  function iniciarCooldown(segundos) {
    clearInterval(temporizador);
    let restante = segundos;
    boton.disabled = true;
    boton.textContent = `Espera ${restante} s…`;
    temporizador = setInterval(() => {
      restante--;
      if (restante <= 0) {
        clearInterval(temporizador);
        boton.disabled = false;
        boton.textContent = "Enviar mensaje 🐝";
      } else {
        boton.textContent = `Espera ${restante} s…`;
      }
    }, 1000);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    boton.disabled = true;
    try {
      const r = await fetch("/api/mensaje", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto: texto.value }),
      });
      const datos = await r.json();
      if (r.ok) {
        mostrarAviso(datos.mensaje, "ok");
        texto.value = "";
        cuenta.textContent = "0";
        iniciarCooldown(10);
      } else if (r.status === 429) {
        mostrarAviso(datos.mensaje, "error");
        iniciarCooldown(datos.restante || 10);
      } else {
        mostrarAviso(datos.mensaje, "error");
        // Groserías también consumen cooldown
        if (datos.error === "groseria") iniciarCooldown(10);
        else boton.disabled = false;
      }
    } catch {
      mostrarAviso("No se pudo enviar. Revisa tu conexión e intenta de nuevo.", "error");
      boton.disabled = false;
    }
  });
;
</script>
</body>
</html>
